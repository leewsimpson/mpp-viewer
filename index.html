<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPP Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="btn-open" class="primary" title="Open a project file (⌘O)">Open…</button>
      <div class="file-info">
        <span id="project-title">No file open</span>
        <span id="project-meta" class="muted"></span>
      </div>
      <div class="spacer"></div>
      <label class="field">
        <span>Zoom</span>
        <select id="zoom">
          <option value="day">Days</option>
          <option value="week" selected>Weeks</option>
          <option value="month">Months</option>
          <option value="quarter">Quarters</option>
        </select>
      </label>
      <label class="toggle"><input type="checkbox" id="opt-critical" /> Critical path</label>
      <label class="toggle"><input type="checkbox" id="opt-baseline" /> Baseline</label>
      <label class="toggle"><input type="checkbox" id="opt-links" checked /> Links</label>
      <button id="btn-expand" title="Expand all">Expand</button>
      <button id="btn-collapse" title="Collapse all">Collapse</button>
      <button id="btn-today" title="Scroll to today">Today</button>
      <input id="search" type="search" placeholder="Find task…" />
    </header>

    <main id="main" hidden>
      <section id="grid">
        <div class="grid-head row">
          <div class="c-id">#</div>
          <div class="c-name">Task name</div>
          <div class="c-dur">Duration</div>
          <div class="c-date">Start</div>
          <div class="c-date">Finish</div>
          <div class="c-pct">%</div>
        </div>
        <div id="grid-body"></div>
      </section>
      <div id="splitter" title="Drag to resize"></div>
      <section id="chart">
        <div id="chart-head"><svg id="scale"></svg></div>
        <div id="chart-body"><svg id="bars"></svg></div>
      </section>
    </main>

    <aside id="details" hidden></aside>

    <div id="empty" class="empty">
      <div class="empty-card">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><rect x="6" y="10" width="20" height="6" rx="1"/><rect x="14" y="21" width="24" height="6" rx="1"/><rect x="22" y="32" width="18" height="6" rx="1"/></svg>
        </div>
        <h1>Open a Microsoft Project file</h1>
        <p>Drop an <b>.mpp</b>, <b>.mpt</b> or Project <b>.xml</b> file here, or click Open.</p>
        <p class="muted small">Everything runs on this Mac. Nothing is uploaded.</p>
        <button id="btn-open-empty" class="primary">Open file…</button>
      </div>
    </div>

    <div id="loading" class="overlay" hidden><div class="spinner"></div><span>Reading file…</span></div>
    <div id="error" class="toast" hidden></div>

    <!-- Browser-only fallback for front-end development without Tauri. -->
    <input id="dev-file" type="file" accept=".json" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
