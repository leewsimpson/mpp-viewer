name: Build & Release

# Push a tag like v0.1.0 to build both Mac versions and publish them as a
# GitHub Release. "Run workflow" in the Actions tab builds them without
# publishing (download from the run's Artifacts section).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: apple-silicon
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build converter and bundled Java runtime
        run: bash scripts/build-converter.sh

      - name: Build app and disk image
        run: npx tauri build --bundles app,dmg

      - name: Name the disk image
        id: dmg
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="dev-${GITHUB_SHA::7}"
          SRC=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          OUT="MPP-Viewer-${VERSION}-${{ matrix.label }}.dmg"
          mv "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.dmg.outputs.file }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          NOTES=$'Download the disk image for your Mac:\n\n'
          NOTES+=$'- **Apple Silicon (M1/M2/M3/M4…)**: `MPP-Viewer-'"$TAG"$'-apple-silicon.dmg`\n'
          NOTES+=$'- **Intel Macs**: `MPP-Viewer-'"$TAG"$'-intel.dmg`\n\n'
          NOTES+=$'The app is not notarised by Apple. After dragging it to Applications, run once in Terminal:\n\n'
          NOTES+=$'```\nxattr -dr com.apple.quarantine "/Applications/MPP Viewer.app"\n```\n'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" \
              --title "MPP Viewer $TAG" --notes "$NOTES"
          fi
