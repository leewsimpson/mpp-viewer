name: Build & Release

# Automatic release: bump "version" in src-tauri/tauri.conf.json (keep
# package.json and src-tauri/Cargo.toml in step) and merge to main. If there
# is no release for that version yet, this builds a signed, notarised Apple
# Silicon app, tags vX.Y.Z and publishes a GitHub Release with the .dmg.
#
# "Run workflow" in the Actions tab builds (and signs) without publishing;
# download the .dmg from the run's Artifacts section.
#
# Repository secrets used for signing and notarising (Settings > Secrets and
# variables > Actions). Without them the build still works but is ad-hoc
# signed and not notarised:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY      e.g. Developer ID Application: Name (TEAMID)
#   APPLE_ID                    Apple ID email
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               10-character team ID
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "converter/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          PKG=$(jq -r .version package.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [[ "$PKG" != "$VERSION" || "$CARGO" != "$VERSION" ]]; then
            echo "::error::Version mismatch: tauri.conf.json=$VERSION package.json=$PKG Cargo.toml=$CARGO"
            exit 1
          fi
          PUBLISH=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
             && ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            PUBLISH=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, publish=$PUBLISH"

  build:
    name: Build (Apple Silicon)
    needs: version
    # Pushes only build when they would publish a new version; manual runs
    # always build.
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::The APPLE_CERTIFICATE secret does not contain the identity named in APPLE_SIGNING_IDENTITY. Export the 'Developer ID Application' certificate with its private key."
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Build converter and bundled Java runtime
        run: bash scripts/build-converter.sh

      # With APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID set, Tauri signs the
      # app, submits it to Apple's notary service and staples the ticket.
      - name: Build app and disk image
        run: |
          # Tauri treats empty variables as set, so drop any that are blank.
          # The raw certificate is already in the keychain; don't hand it over too.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!v}" ]] || unset "$v"
          done
          npx tauri build --bundles app,dmg

      - name: Notarise disk image
        if: env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$DMG"

      - name: Verify signature
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv "$APP"

      - name: Name the disk image
        id: dmg
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          SRC=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          NAME="$VERSION"
          [[ "${{ needs.version.outputs.publish }}" == "true" ]] || NAME="${VERSION}-dev-${GITHUB_SHA::7}"
          OUT="MPP-Viewer-${NAME}.dmg"
          mv "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: MPP-Viewer
          path: ${{ steps.dmg.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          FILE: ${{ steps.dmg.outputs.file }}
        run: |
          NOTES=$'Download `'"$FILE"$'` below (Apple Silicon Macs), open it and drag **MPP Viewer** to Applications.\n'
          if [[ -z "$APPLE_ID" ]]; then
            NOTES+=$'\nThis build is not notarised by Apple. After dragging it to Applications, run once in Terminal:\n\n'
            NOTES+=$'```\nxattr -dr com.apple.quarantine "/Applications/MPP Viewer.app"\n```\n'
          fi
          gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "MPP Viewer $TAG" \
            --notes "$NOTES" --generate-notes
