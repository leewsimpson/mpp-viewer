[package]
name = "mpp-viewer"
# The app version comes from package.json (see tauri.conf.json); this one is unused.
version = "0.0.0"
description = "Offline viewer for Microsoft Project files on macOS"
edition = "2021"

[lib]
name = "mpp_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
